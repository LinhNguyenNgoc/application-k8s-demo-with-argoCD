apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-app-argo-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LinhNguyenNgoc/application-k8s-demo-with-argoCD.git # <-- Repo Config
    targetRevision: main
    path: spring-boot-chart # Thư mục Helm chart hiện nằm ở Repo Config
  destination: 
    server: https://kubernetes.default.svc
    namespace: spring-app
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true