apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-app-argo-application
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/LinhNguyenNgoc/application-demo-with-argoCD.git
    targetRevision: main
    path: spring-boot-chart   # Trỏ vào thư mục chứa Helm Chart trong repo application
  destination: 
    server: https://kubernetes.default.svc
    namespace: spring-app

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true